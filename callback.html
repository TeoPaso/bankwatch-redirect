<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Torna a Bank Watch</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7f4;--fg:#1d2420;--muted:#5b665f;--accent:#1f6f5b}
@media (prefers-color-scheme:dark){:root{--bg:#121714;--fg:#e7ece8;--muted:#9aa8a0;--accent:#6fcfb2}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
main{max-width:420px;text-align:center}
h1{font-size:1.5rem;margin:0 0 12px}
p{color:var(--muted);margin:8px 0}
button{margin-top:16px;font:inherit;padding:12px 20px;border-radius:8px;border:0;background:var(--accent);color:var(--bg);font-weight:600;cursor:pointer}
</style>
</head>
<body>
<main>
<h1>Torna a Bank Watch</h1>
<p>Il collegamento con la banca è completato. Per finire, copia l'indirizzo di questa pagina e incollalo nell'app.</p>
<button type="button" id="copy">Copia indirizzo</button>
<p id="msg" role="status"></p>
<p>Questa pagina non salva e non invia nulla: i dati restano sul tuo telefono.</p>
</main>
<script>
document.getElementById('copy').addEventListener('click',function(){
  var m=document.getElementById('msg');
  function ok(){m.textContent='Indirizzo copiato. Apri Bank Watch e tocca Incolla.';}
  function ko(){m.textContent='Copia dalla barra del browser (tieni premuto sull\'indirizzo).';}
  try{navigator.clipboard.writeText(location.href).then(ok,ko);}catch(e){ko();}
});
</script>
</body>
</html>
